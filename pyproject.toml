[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-manga-recommendation-system"
version = "0.1.0"
description = "AI-powered Manga, Manhwa and Manhua Recommendation System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Samarth Joshi" }
]

dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "python-dotenv>=1.1,<2.0",
    "tenacity>=9.1,<10.0",
    "orjson>=3.11,<4.0",
    "pandas>=2.3,<3.0",
    "numpy>=2.3,<3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    "black>=25.0,<26.0",
    "ruff>=0.12,<1.0",
    "mypy>=1.17,<2.0",
    "pre-commit>=4.3,<5.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["common*", "ml*", "backend*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true